name: Email inbox poll

on:
  schedule:
    # Every 5 minutes — fastest reliable schedule on GitHub Actions
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Poll all connected Gmail inboxes
        env:
          APP_URL: https://yonderly.online
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=yonderly-cron" | jq -r .value)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Could not get GitHub OIDC token for yonderly-cron audience"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "$APP_URL/api/cron/email-poll")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "Poll failed with HTTP $code"
            exit 1
          fi
