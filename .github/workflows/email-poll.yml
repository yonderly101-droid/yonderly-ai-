name: Email inbox poll

on:
  schedule:
    # Every 5 minutes — fastest reliable schedule on GitHub Actions
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Poll all connected Gmail inboxes
        uses: actions/github-script@v7
        env:
          APP_URL: https://yonderly.online
        with:
          script: |
            const token = await core.getIDToken('yonderly-cron');
            const response = await fetch(`${process.env.APP_URL}/api/cron/email-poll`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}` },
            });
            const body = await response.text();
            console.log(body);
            if (!response.ok) {
              core.setFailed(`Poll failed with HTTP ${response.status}: ${body}`);
            }
