<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yonderly — Sign in</title>
  <style>
    :root { --bg:#0f1419; --card:#1a2332; --text:#e7ecf3; --muted:#9aa8bc; --accent:#6c8cff; --border:#2a3648; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:32px; }
    h1 { margin:0 0 8px; font-size:1.5rem; }
    p { color:var(--muted); margin:0 0 24px; line-height:1.5; }
    label { display:block; font-size:.85rem; margin-bottom:6px; color:var(--muted); }
    input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:#111827; color:var(--text); margin-bottom:14px; }
    button { width:100%; padding:12px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    button.google { background:#fff; color:#1f2937; display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:16px; border:1px solid #d1d5db; }
    button.google svg { width:18px; height:18px; }
    .divider { display:flex; align-items:center; gap:12px; color:var(--muted); font-size:.85rem; margin:16px 0; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }
    .error { background:#3b1d24; color:#ffb4b4; padding:10px 12px; border-radius:8px; margin-bottom:14px; display:none; font-size:.9rem; line-height:1.4; }
    .error.show { display:block; }
    .info { background:#1a2a3a; color:#b8d4ff; padding:10px 12px; border-radius:8px; margin-bottom:14px; display:none; font-size:.9rem; }
    .info.show { display:block; }
    .tabs { display:flex; gap:8px; margin-bottom:20px; }
    .tab { flex:1; padding:10px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; }
    .tab.active { background:#243047; color:var(--text); border-color:var(--accent); }
    a { color:var(--accent); text-decoration:none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="card">
    <h1>Welcome to Yonderly</h1>
    <p id="subtitle">Sign in to access your AI employee dashboard.</p>
    <div class="error" id="error"></div>
    <div class="info" id="info"></div>

    <button type="button" class="google" id="google-btn">
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6.01c4.51-4.18 7.09-10.36 7.09-17.66z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6.01c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>

    <div class="divider">or use email</div>

    <div class="tabs">
      <button type="button" class="tab active" id="tab-signin">Sign in</button>
      <button type="button" class="tab" id="tab-signup">Create account</button>
    </div>
    <form id="auth-form">
      <div id="name-field" style="display:none">
        <label for="full_name">Full name</label>
        <input id="full_name" type="text" placeholder="Your name">
      </div>
      <label for="email">Email</label>
      <input id="email" type="email" required placeholder="you@business.com">
      <label for="password">Password</label>
      <input id="password" type="password" required minlength="8" placeholder="At least 8 characters">
      <button type="submit" id="submit-btn">Sign in</button>
    </form>
    <p style="margin-top:20px;font-size:.9rem"><a href="/">← Back to home</a></p>
  </div>
  <script src="/js/auth.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const next = params.get('next') || '/dashboard';
    let mode = 'signin';

    const errorEl = document.getElementById('error');
    const infoEl = document.getElementById('info');
    const submitBtn = document.getElementById('submit-btn');
    const googleBtn = document.getElementById('google-btn');
    const subtitle = document.getElementById('subtitle');

    if (sessionStorage.getItem('pending_subscription_id')) {
      subtitle.textContent = 'Sign in to activate your subscription and set up your agent.';
    }

    function showError(msg) {
      infoEl.classList.remove('show');
      errorEl.textContent = msg;
      errorEl.classList.add('show');
    }

    function showInfo(msg) {
      errorEl.classList.remove('show');
      infoEl.textContent = msg;
      infoEl.classList.add('show');
    }

    function setMode(nextMode) {
      mode = nextMode;
      document.getElementById('tab-signin').classList.toggle('active', mode === 'signin');
      document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
      document.getElementById('name-field').style.display = mode === 'signup' ? 'block' : 'none';
      submitBtn.textContent = mode === 'signup' ? 'Create account' : 'Sign in';
    }

    document.getElementById('tab-signin').onclick = () => setMode('signin');
    document.getElementById('tab-signup').onclick = () => setMode('signup');

    async function afterAuth() {
      const session = await YonderlyAuth.getSession();
      if (!session) return false;

      const subId = sessionStorage.getItem('pending_subscription_id');
      if (subId) {
        await YonderlyAuth.activateSubscription(subId);
        sessionStorage.removeItem('pending_subscription_id');
      }

      let account;
      try {
        account = await YonderlyAuth.fetchAccount();
      } catch (err) {
        showError(err.message);
        return false;
      }

      if (account.requireSubscription && !account.isActive) {
        location.href = '/dashboard?billing=required';
        return true;
      }
      if (!account.hasBusinessProfile) {
        location.href = '/onboarding';
        return true;
      }
      location.href = next.startsWith('/') ? next : '/dashboard';
      return true;
    }

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('show');
      infoEl.classList.remove('show');
      submitBtn.disabled = true;
      try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        if (mode === 'signup') {
          const fullName = document.getElementById('full_name').value.trim();
          const result = await YonderlyAuth.signUp(email, password, fullName);
          if (!result.session) {
            showInfo('Account created. Check your email to confirm, then sign in.');
            setMode('signin');
            submitBtn.disabled = false;
            return;
          }
        } else {
          await YonderlyAuth.signIn(email, password);
        }
        const ok = await afterAuth();
        if (!ok) submitBtn.disabled = false;
      } catch (err) {
        showError(YonderlyAuth.authErrorMessage(err));
        submitBtn.disabled = false;
      }
    });

    googleBtn.addEventListener('click', async () => {
      errorEl.classList.remove('show');
      googleBtn.disabled = true;
      try {
        await YonderlyAuth.signInWithGoogle(next);
      } catch (err) {
        showError(YonderlyAuth.authErrorMessage(err));
        googleBtn.disabled = false;
      }
    });

    (async function boot() {
      try {
        await YonderlyAuth.handleOAuthReturn();
        const session = await YonderlyAuth.getSession();
        if (session) await afterAuth();
      } catch (err) {
        showError(YonderlyAuth.authErrorMessage(err));
      }
    })();
  </script>
</body>
</html>
